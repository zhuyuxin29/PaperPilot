[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot"
version = "0.1.0"
description = "带证据的文献阅读 Agent：七类要点、文献内问答、图谱关系召回"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pypdf>=6,<7",
    "streamlit>=1.40,<2",
    "numpy>=1.26",
    "requests>=2.31",
    "jieba>=0.42,<1",
    "pypdfium2>=4,<6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
graph = ["neo4j>=5.20,<7"]
chroma = ["chromadb>=0.5.23,<0.6", "posthog<6"]

[tool.setuptools.packages.find]
include = ["paperpilot*", "api*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
